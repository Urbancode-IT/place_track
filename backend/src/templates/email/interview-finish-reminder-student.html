<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
        <tr>
          <td style="background:#0f766e;padding:16px 24px;">
            <p style="margin:0;color:#ffffff;font-size:16px;font-weight:700;">PlaceTrack</p>
            <p style="margin:4px 0 0;color:#ccfbf1;font-size:12px;">Urbancode · Update pending</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px;">
            <p style="margin:0 0 12px;font-size:15px;color:#111827;">Hi {{studentName}},</p>
            <p style="margin:0 0 16px;font-size:15px;color:#374151;line-height:1.5;">
              We have not received your update for <strong>{{company}}</strong> ({{round}}) on <strong>{{date}}</strong> at <strong>{{timeSlot}}</strong>.
            </p>
            <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">Outcome form</p>
            <p style="margin:0 0 16px;font-size:14px;word-break:break-all;"><a href="{{finishUrl}}" style="color:#0f766e;">{{finishUrl}}</a></p>
            <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">Questions form</p>
            <p style="margin:0;font-size:14px;word-break:break-all;"><a href="{{questionsUrl}}" style="color:#0f766e;">{{questionsUrl}}</a></p>
          </td>
        </tr>
        <tr><td style="padding:0 24px 20px;"><p style="margin:0;font-size:12px;color:#9ca3af;">Urbancode Placement · PlaceTrack</p></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
