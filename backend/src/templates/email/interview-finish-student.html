<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#ffffff;color:#222222;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;">
  <div style="max-width:560px;margin:0 auto;padding:24px 16px;">
    <p style="margin:0 0 16px;">Hi {{studentName}},</p>
    <p style="margin:0 0 16px;">
      Your interview with {{company}} ({{round}}) on {{date}} at {{timeSlot}} is complete on the schedule.
      Submit the outcome and any interview questions using the links below.
    </p>
    <p style="margin:0 0 8px;">Outcome form:<br>
      <a href="{{finishUrl}}" style="color:#1a56db;word-break:break-all;">{{finishUrl}}</a>
    </p>
    <p style="margin:0 0 16px;">Questions form:<br>
      <a href="{{questionsUrl}}" style="color:#1a56db;word-break:break-all;">{{questionsUrl}}</a>
    </p>
    <p style="margin:24px 0 0;color:#555555;font-size:13px;">PlaceTrack · Urbancode</p>
  </div>
</body>
</html>
